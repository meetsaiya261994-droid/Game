name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - run: npm install --legacy-peer-deps
      - run: npx vite build
      - run: npm install --legacy-peer-deps @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
      - run: echo '{"appId":"com.templequest.runcrush","appName":"Temple Quest","webDir":"dist"}' > capacitor.config.json
      - run: npx cap add android && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TempleQuest-APK
          path: android/app/build/outputs/apk/debug/*.apk
